services:
  - type: web
    name: era-telegram-bot
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /ready
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: MINIAPP_AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: era-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: era-redis-persistent
          property: connectionString
      - key: OPENAI_MODEL
        value: gpt-5.5
      - key: ERA_CHANNEL_ID
        value: "-1002977129337"
      - key: ERA_CHANNEL_URL
        value: https://t.me/+kFak7gRKoA8xYTc6
      - key: ERA_PRO_CHANNEL_URL
        value: https://t.me/+WSagiElAvEsxMTI6
      - key: GENERAL_CHAT_ID
        value: "-1002973371133"
      - key: GENERAL_CHAT_URL
        value: https://t.me/+Q6MzTrnR21dmZjgy
      - key: INTERNAL_DEPARTMENT_CHAT_URL
        value: https://t.me/+zV8olVtkdc8yMWVi
      - key: EXTERNAL_DEPARTMENT_CHAT_URL
        value: https://t.me/+PsEYN685g1w5ZmEy
      - key: LEADERS_CHAT_URL
        value: https://t.me/+V3OkO1PNwmhiY2Ni
      - key: ADMIN_IDS
        value: "1593868942"
      - key: TIMEZONE
        value: Asia/Yerevan
      - key: LOG_LEVEL
        value: INFO
      - key: FEATURE_NATIVE_EVENT_COMPOSER
        value: TESTERS
      - key: NATIVE_EVENT_COMPOSER_TESTER_IDS
        value: "1593868942"
      - key: FEATURE_MANAGEMENT_REPORTS
        value: ALL
      - key: MANAGEMENT_REPORT_RECIPIENT_IDS
        value: "[]"
      - key: FEATURE_QUICK_REGISTRATION
        value: TESTERS
      - key: QUICK_REGISTRATION_TESTER_IDS
        value: "1593868942"
      - key: FEATURE_REVIEW_REMINDERS
        value: TESTERS
      - key: REVIEW_REMINDER_RECIPIENT_IDS
        value: "1593868942"
      - key: FEATURE_ATTENDANCE_QR
        value: TESTERS
      - key: ATTENDANCE_QR_TESTER_IDS
        value: "1593868942"
      - key: FEATURE_GAMES
        value: ALL
      - key: GAMES_REWARDS_ENABLED
        value: "true"

  - type: keyvalue
    name: era-redis-persistent
    region: frankfurt
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

databases:
  - name: era-postgres
    region: frankfurt
    plan: basic-256mb
    databaseName: era_nfvd
    user: era
    # Bot, migrations and snapshot export connect from Render's private network.
    ipAllowList: []
