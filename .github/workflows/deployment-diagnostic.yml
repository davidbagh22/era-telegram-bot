name: Deployment diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect main CI and production health
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PRODUCTION_HEALTH: https://era-telegram-bot.onrender.com/health
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ['REPO']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=5',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              runs = json.load(response).get('workflow_runs', [])
          for run in runs:
              print('MAIN_CI', run.get('run_number'), run.get('status'), run.get('conclusion'), run.get('head_sha'))
          PY
          HEALTH="$(curl --fail-with-body --silent --show-error --max-time 20 "${PRODUCTION_HEALTH}")"
          LIVE="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit", ""))' <<<"${HEALTH}")"
          echo "PRODUCTION_COMMIT=${LIVE}"
