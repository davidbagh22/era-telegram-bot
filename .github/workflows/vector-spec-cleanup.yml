name: Vector spec cleanup

on:
  push:
    branches: [era-platform-unification-final]
    paths:
      - ".github/workflows/vector-spec-cleanup.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: era-platform-unification-final
          fetch-depth: 0
      - name: Align My Vector with approved product model
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("frontend/src/screens/VectorHomeScreen.tsx")
          text = path.read_text()
          text = text.replace('const ERA_PRO_THRESHOLD = 8_000;\n', '')
          text = text.replace('  const remaining = Math.max(0, ERA_PRO_THRESHOLD - data.points_balance);\n', '')
          text = text.replace('  const proPercent = Math.min(100, Math.round((data.points_balance / ERA_PRO_THRESHOLD) * 100));\n', '')
          text = text.replace('Короткий check-in · можно продолжить позже', 'Ежемесячная отметка · можно продолжить позже')
          text = text.replace('Check-in, личные выводы, цели и динамика собираются в хронологию, чтобы сравнивать себя прежде всего с собой.', 'Ежемесячные отметки, личные выводы, цели и динамика собираются в хронологию, чтобы сравнивать себя прежде всего с собой.')

          pattern = re.compile(
              r'\n      <section style=\{\{ display: "flex", flexDirection: "column", gap: "0\.55rem" \}\}>\n'
              r'        <MonoLabel>Следующий уровень</MonoLabel>\n'
              r'.*?'
              r'\n      </section>\n\n'
              r'(?=      <section style=\{\{ display: "flex", flexDirection: "column", gap: "0\.55rem" \}\}>\n        <MonoLabel>Рекомендация</MonoLabel>)',
              re.S,
          )
          text, removed = pattern.subn('\n', text)
          if removed != 1:
              raise SystemExit(f"Expected one ERA PRO promotion section, removed {removed}")
          forbidden = ["ERA_PRO_THRESHOLD", "ЭРА PRO", "check-in", "Check-in", "до PRO", "до ПРО"]
          leftovers = [value for value in forbidden if value in text]
          if leftovers:
              raise SystemExit("Forbidden My Vector copy remains: " + ", ".join(leftovers))
          path.write_text(text)
          PY
          git diff --check
      - name: Commit and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/vector-spec-cleanup.yml
          git add frontend/src/screens/VectorHomeScreen.tsx
          git commit -m "Align My Vector with approved growth model"
          git push origin HEAD:era-platform-unification-final
