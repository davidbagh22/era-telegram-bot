name: Production read-only smoke

# Run only after the trusted main-branch Bot checks succeed. This workflow
# never deploys, authenticates, sends Telegram messages, or changes server data.
on:
  workflow_run:
    workflows: ["Bot checks"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: era-production-readonly-smoke-main
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact main SHA and eight anonymous read-only HTTP gates
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          # Render autoDeploy=checksPass can finish after GitHub CI. Poll for
          # the new commit prefix, but never treat DNS failure as acceptance.
          for attempt in 1 2 3 4 5 6; do
            echo "Production smoke attempt ${attempt}/6 for ${EXPECTED_SHA}"
            if python scripts/production_readonly_smoke.py --expected-sha "$EXPECTED_SHA" --timeout 5; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 30
            fi
          done
          echo 'Production smoke not accepted; inspect exact Render LIVE SHA and routes.' >&2
          exit 1
