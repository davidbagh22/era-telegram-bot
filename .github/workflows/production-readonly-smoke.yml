name: Production read-only smoke

# Independent periodic read-only verification. Do NOT trigger on workflow_run
# or push: Render autoDeploy=checksPass may wait for all commit checks, creating
# a circular wait if a post-CI workflow waits for Render to become LIVE.
# Scheduled runs can report a pending deploy but cannot block its release.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: era-production-readonly-smoke-main
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.repository == 'davidbagh22/era-telegram-bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact main SHA and eight anonymous read-only HTTP gates
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          # Resolve the exact checked-out main commit at run time.
          EXPECTED_SHA="$(git rev-parse HEAD)"
          # Poll boundedly; DNS or a pending deployment never counts as PASS.
          for attempt in 1 2 3 4 5 6; do
            echo "Production smoke attempt ${attempt}/6 for ${EXPECTED_SHA}"
            if python scripts/production_readonly_smoke.py --expected-sha "$EXPECTED_SHA" --timeout 5; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 30
            fi
          done
          echo 'Production smoke not accepted; inspect exact Render LIVE SHA and routes.' >&2
          exit 1
