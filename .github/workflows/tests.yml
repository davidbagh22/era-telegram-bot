name: Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BOT_TOKEN: "0000000000:CITESTTOKEN"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - name: Build system audit report
        run: |
          python scripts/system_audit_report.py
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("system_audit_report.json").read_text())
          for issue in report["issues"]:
              print(json.dumps(issue, ensure_ascii=False))
          raise SystemExit(1 if report["issues"] else 0)
          PY
      - name: Upload system audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: system-audit-report
          path: system_audit_report.json
      - run: pip install pytest
      - run: python -m pytest -q
