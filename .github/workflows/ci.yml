name: Bot checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks (full history)
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-git=false --redact -v

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile application
        run: python -m compileall -q app
      - name: Validate general chat content
        run: python scripts/validate_general_chat_content.py
      - name: Lint correctness in isolated environment
        run: |
          python -m venv /tmp/era-ruff
          /tmp/era-ruff/bin/python -m pip install --disable-pip-version-check --no-input ruff
          /tmp/era-ruff/bin/python -m ruff check app --select E9,F
      - name: Audit Python dependencies in isolated environment
        run: |
          python -m venv /tmp/era-pip-audit
          /tmp/era-pip-audit/bin/python -m pip install --disable-pip-version-check --no-input pip-audit
          /tmp/era-pip-audit/bin/pip-audit -r requirements.txt --strict
      - name: Run tests against application environment
        run: python -m pytest -q

  postgres-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: era_test
          POSTGRES_PASSWORD: era_test
          POSTGRES_DB: era_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U era_test -d era_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql+asyncpg://era_test:era_test@127.0.0.1:5432/era_test
      BOT_TOKEN: "0000000000:POSTGRESMIGRATIONSMOKE"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Upgrade a clean PostgreSQL database through every migration
        run: alembic upgrade heads
      - name: Run the real startup seed path and verify timestamp defaults
        run: python scripts/postgres_migration_smoke.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      PYTHONPATH: .
      DATABASE_URL: sqlite+aiosqlite:///./e2e.db
      BOT_TOKEN: "0000000000:E2ETESTTOKEN"
      MINIAPP_AUTH_SECRET: e2e-test-secret
      DEV_AUTH_ENABLED: "true"
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend (the exact bundle the backend will serve)
        working-directory: frontend
        run: npm run build
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Seed E2E fixtures (participant/leader/admin/pending applicant)
        run: python scripts/e2e_seed.py
      - name: Start backend
        run: |
          nohup python -m uvicorn app.webapp:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          echo $! > uvicorn.pid
      - name: Wait for backend to be ready
        run: curl --retry 20 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:8000/health
      - name: Run E2E tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
          PLAYWRIGHT_HTML_OPEN: never
        shell: bash
        run: |
          set -o pipefail
          npx playwright test --reporter=line,html 2>&1 | tee playwright-output.log
      - name: Playwright failure summary
        if: failure()
        working-directory: frontend
        shell: bash
        run: |
          tail -n 220 playwright-output.log || true
          echo "### Playwright failure" >> "${GITHUB_STEP_SUMMARY}"
          tail -n 220 playwright-output.log >> "${GITHUB_STEP_SUMMARY}" || true
          grep -E "([0-9]+\)|Error:|TimeoutError:|Locator:|Expected:|Received:|at .*\.spec\.ts:)" playwright-output.log \
            | tail -n 30 \
            | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' \
            | while IFS= read -r line; do echo "::error title=Playwright failure::${line}"; done || true
      - name: Backend log (on failure)
        if: failure()
        run: cat uvicorn.log || true
      - name: Stop backend
        if: always()
        run: |
          if [ -f uvicorn.pid ]; then kill "$(cat uvicorn.pid)" || true; fi
      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
