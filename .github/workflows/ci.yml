name: Bot checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app
      - name: Lint (correctness rules only, not a style check)
        run: |
          python -m pip install ruff
          python -m ruff check app --select E9,F
      - name: Python dependency audit
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt --strict
      - name: Run tests
        run: |
          python -m pip install pytest
          python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Dependency audit
        # Blocking again as of PR18b — the esbuild/vite advisory that made
        # this non-blocking in PR13 is fixed (Vite upgraded past it).
        run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      PYTHONPATH: .
      DATABASE_URL: sqlite+aiosqlite:///./e2e.db
      BOT_TOKEN: "0000000000:E2ETESTTOKEN"
      MINIAPP_AUTH_SECRET: e2e-test-secret
      DEV_AUTH_ENABLED: "true"
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend (the exact bundle the backend will serve)
        working-directory: frontend
        run: npm run build
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Seed E2E fixtures (participant/leader/admin/pending applicant)
        run: python scripts/e2e_seed.py
      - name: Start backend
        run: |
          nohup python -m uvicorn app.webapp:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          echo $! > uvicorn.pid
      - name: Wait for backend to be ready
        run: curl --retry 20 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:8000/health
      - name: Run E2E tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
        run: npx playwright test
      - name: Backend log (on failure)
        if: failure()
        run: cat uvicorn.log || true
      - name: Stop backend
        if: always()
        run: kill "$(cat uvicorn.pid)" 2>/dev/null || true
      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
